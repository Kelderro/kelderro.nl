name: CI

on:
    pull_request:
    push:
        branches:
            - main

# Least privilege: every job gets read-only access by default. Jobs that need
# more declare it themselves.
permissions:
    contents: read

jobs:
    build_and_deploy:
        name: Build and Deploy
        runs-on: ubuntu-latest

        env:
            CURRENT_BRANCH: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}

        outputs:
            preview_url: ${{ steps.deploy.outputs.deployment-url }}

        steps:
            - name: Checkout repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Setup pnpm
              uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

            - name: Setup Node.js
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version-file: '.nvmrc'
                  cache: 'pnpm'

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            # Verify only. Formatting/linting is auto-fixed locally via the
            # husky + lint-staged pre-commit hook, so CI must NOT rewrite the PR
            # HEAD. Pushing an auto-fix commit here (previously with [skip ci])
            # left the required status checks stuck on a commit that CI never
            # runs against.
            - name: Lint
              run: pnpm run lint

            - name: Check formatting
              run: pnpm run format:check

            - name: Type check
              run: pnpm run type-check

            - name: Build
              run: pnpm build

            # Preview deployments require Cloudflare secrets, which are not
            # available to Dependabot or fork pull requests. Skip the deploy in
            # those cases so the required "Build and Deploy" check can still pass.
            - name: Deploy to Cloudflare Pages
              id: deploy
              if: >-
                  github.event_name == 'push' ||
                  (github.actor != 'dependabot[bot]' &&
                  github.event.pull_request.head.repo.full_name == github.repository)
              uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
              with:
                  apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
                  accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
                  command: pages deploy dist --project-name="kelderro-nl" --branch="${{ env.CURRENT_BRANCH }}"
              env:
                  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
                  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    e2e:
        name: E2E tests
        # Playwright starts its own local astro dev server (see
        # playwright.config.ts), so these tests need neither the deployment nor
        # any secrets. Keeping this job independent lets it pass for Dependabot
        # and run in parallel with the build.
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Setup pnpm
              uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

            - name: Setup Node.js
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version-file: '.nvmrc'
                  cache: 'pnpm'

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Install Playwright browsers
              run: pnpm exec playwright install --with-deps chromium firefox webkit

            - name: Run Playwright tests
              run: pnpm exec playwright test
              env:
                  CI: true
                  WRANGLER_SEND_METRICS: false

            - name: Upload Playwright report
              if: failure()
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: playwright-report
                  path: playwright-report/
                  retention-days: 7

    lighthouse:
        name: Lighthouse CI
        needs: build_and_deploy
        # On pull requests this audits the preview deployment, which needs the
        # Cloudflare Access secrets, so it only runs for non-Dependabot pull
        # requests from this repository. On pushes to main it audits the
        # public production site, so merged changes (including Dependabot
        # bumps) are still checked.
        if: >-
            github.event_name == 'push' ||
            (github.event_name == 'pull_request' &&
            github.actor != 'dependabot[bot]' &&
            github.event.pull_request.head.repo.full_name == github.repository)
        runs-on: ubuntu-latest
        permissions:
            contents: read
            # Posts the sticky Lighthouse comment on the pull request.
            pull-requests: write
        env:
            IS_PRODUCTION: ${{ github.event_name == 'push' }}
            TARGET_URL: ${{ github.event_name == 'push' && 'https://kelderro.nl' || needs.build_and_deploy.outputs.preview_url }}

        steps:
            # Needed for the pnpm version (package.json) and Node version (.nvmrc).
            - name: Checkout repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Setup pnpm
              uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

            - name: Setup Node.js
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version-file: '.nvmrc'

            - name: Check security headers
              # public/_headers is the source of truth for the security headers.
              # Preview deployments only get those headers, so they must match
              # the file exactly. Production must send all of them, but a
              # different value is only a warning while a Cloudflare dashboard
              # rule may still override the file (see #154).
              run: node scripts/check-security-headers.mjs "$TARGET_URL" ${{ github.event_name == 'pull_request' && '--exact' || '' }}
              env:
                  CF_ACCESS_CLIENT_ID: ${{ github.event_name == 'pull_request' && secrets.CF_ACCESS_CLIENT_ID || '' }}
                  CF_ACCESS_CLIENT_SECRET: ${{ github.event_name == 'pull_request' && secrets.CF_ACCESS_CLIENT_SECRET || '' }}

            - name: Create lighthouserc.json
              # Preview config: sends the Zero Trust headers and disables
              # is-crawlable, because Cloudflare Pages automatically adds
              # 'noindex' headers to preview deployments, causing this audit to
              # always fail regardless of the actual site configuration.
              # Production is public and must be crawlable, so for pushes to main
              # the headers are removed and is-crawlable is asserted again.
              run: |
                  cat << 'EOF' > lighthouserc.json
                  {
                    "ci": {
                      "collect": {
                        "numberOfRuns": 1,
                        "settings": {
                          "extraHeaders": {
                            "CF-Access-Client-Id": "${{ secrets.CF_ACCESS_CLIENT_ID }}",
                            "CF-Access-Client-Secret": "${{ secrets.CF_ACCESS_CLIENT_SECRET }}"
                          },
                          "skipAudits": ["is-crawlable"]
                        }
                      },
                      "assert": {
                        "preset": "lighthouse:recommended",
                        "assertions": {
                          "is-crawlable": "off",
                          "forced-reflow-insight": "warn",
                          "image-delivery-insight": "warn",
                          "lcp-discovery-insight": "warn",
                          "network-dependency-tree-insight": "warn",
                          "prioritize-lcp-image": "warn",
                          "target-size": "warn",
                          "unused-javascript": "warn"
                        }
                      }
                    }
                  }
                  EOF

                  if [ "$IS_PRODUCTION" = "true" ]; then
                    jq 'del(.ci.collect.settings.extraHeaders, .ci.collect.settings.skipAudits, .ci.assert.assertions["is-crawlable"])' \
                      lighthouserc.json > lighthouserc.tmp && mv lighthouserc.tmp lighthouserc.json
                  fi

            - name: Run Lighthouse CI
              run: |
                  pnpm dlx @lhci/cli autorun \
                    --collect.url="$TARGET_URL" \
                    --upload.target=filesystem \
                    --upload.outputDir="./lhci-report"

            - name: Upload Lighthouse report
              if: always()
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: lighthouse-report
                  path: lhci-report

            - name: Comment Lighthouse results on PR
              if: always() && github.event_name == 'pull_request'
              uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
              with:
                  message: |
                      🔍 **Lighthouse CI Report**

                      Preview URL: ${{ env.TARGET_URL }}

                      A full Lighthouse report has been generated and uploaded as an artifact.

                      Categories audited:
                      - Performance  
                      - Accessibility  
                      - Best Practices  
                      - SEO
