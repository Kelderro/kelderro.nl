# OpenSSF Scorecard: an independent, public score for this repository's
# supply-chain security practices (pinned dependencies, token permissions,
# branch protection, code review, and more). Results are published to the
# OpenSSF API for the README badge and uploaded to GitHub code scanning.
#
# With publish_results enabled, Scorecard verifies this workflow on the OpenSSF
# side: it must not have top-level env or defaults, must use read-only
# top-level permissions, and may only run approved actions in the job.
name: OpenSSF Scorecard

on:
    push:
        branches:
            - main
    schedule:
        # Weekly on Saturday, matching the Dependabot schedule.
        - cron: '30 6 * * 6'
    # Re-score when branch protection changes.
    branch_protection_rule:
    workflow_dispatch:

permissions: read-all

jobs:
    analysis:
        name: Scorecard analysis
        runs-on: ubuntu-latest
        # Only score the canonical repository, not forks.
        if: github.repository == 'Kelderro/kelderro.nl'
        permissions:
            # Upload the results to code scanning.
            security-events: write
            # Prove to the OpenSSF API that the results come from this workflow.
            id-token: write

        steps:
            - name: Checkout repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Run Scorecard analysis
              uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
              with:
                  results_file: results.sarif
                  results_format: sarif
                  publish_results: true

            - name: Upload results as artifact
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: scorecard-results
                  path: results.sarif
                  retention-days: 5

            - name: Upload results to code scanning
              uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
              with:
                  sarif_file: results.sarif
