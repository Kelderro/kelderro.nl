# Automatically merge Dependabot PRs for minor and patch updates once the
# required status checks pass. There is no approval step: the main branch
# ruleset requires no approving reviews, and GitHub Actions is not allowed to
# approve pull requests in this repository, so an approval step would fail and
# stop the job before auto-merge is enabled.
name: Dependabot auto-merge
on: pull_request

permissions:
    contents: write
    pull-requests: write

jobs:
    dependabot:
        runs-on: ubuntu-latest
        if: github.event.pull_request.user.login == 'dependabot[bot]' && github.repository == 'Kelderro/kelderro.nl'
        steps:
            - name: Dependabot metadata
              id: metadata
              uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
              with:
                  github-token: '${{ secrets.GITHUB_TOKEN }}'
            - name: Enable auto-merge for Dependabot PRs
              if: steps.metadata.outputs.update-type == 'version-update:semver-patch' || steps.metadata.outputs.update-type == 'version-update:semver-minor'
              run: gh pr merge --auto --squash "$PR_URL"
              env:
                  PR_URL: ${{ github.event.pull_request.html_url }}
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
