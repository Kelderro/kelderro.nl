allowBuilds:
    '@sentry/cli': true
    esbuild: true
    workerd: true

# The WASM bindings (astro2tsx, compiler-binding) are built against emnapi 1.x; pnpm's peer
# auto-install otherwise pulls the incompatible 2.0 alpha, which breaks `astro check`.
overrides:
    '@emnapi/core': 1.11.3
    '@emnapi/runtime': 1.11.3
    # ESLint and typescript-eslint still request minimatch ^10; 11.0.1 fixes a denial of service
    # (Dependabot alert #272). Scoped to these parents: glob 13 (via Sentry) finds no files with
    # minimatch 11. Remove once they depend on ^11.
    'eslint>minimatch': ^11.0.1
    '@eslint/config-array>minimatch': ^11.0.1
    '@typescript-eslint/typescript-estree>minimatch': ^11.0.1
